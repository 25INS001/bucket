name: bucket CI/CD

on:
  pull_request:
    branches: [prod-c, dev-c]
  push:
    branches: [prod-c, dev-c]
  workflow_dispatch:
    inputs:
      environment:
        description: "Kubernetes environment to deploy"
        required: true
        default: dev
        type: choice
        options: [dev, prod]

env:
  IMAGE_NAME: ghcr.io/25ins001/phasicon-bucket
  DEPLOYMENT_NAME: bucket
  CONTAINER_NAME: bucket

jobs:
  test:
    name: Django tests
    runs-on: ubuntu-24.04
    # settings.py requires Postgres and no longer falls back to sqlite, so the
    # suite needs a real server to create its test database against.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bucket_ci
          POSTGRES_USER: bucket_ci
          POSTGRES_PASSWORD: bucket_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bucket_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Django checks and tests
        env:
          # settings.py reads BUCKET_*, not DJANGO_*. Throwaway CI values: the
          # key only has to exist for `check` and the test client.
          BUCKET_SECRET_KEY: ci-secret
          BUCKET_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_DB: bucket_ci
          POSTGRES_USER: bucket_ci
          POSTGRES_PASSWORD: bucket_ci
          GARAGE_ENDPOINT: "http://127.0.0.1:8333"
          GARAGE_ACCESS_KEY: test
          GARAGE_SECRET_KEY: test
          GARAGE_REGION: us-east-1
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test --verbosity 2

  prepare:
    name: Resolve deploy target
    runs-on: ubuntu-24.04
    if: github.event_name != 'pull_request'
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      namespace: ${{ steps.target.outputs.namespace }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - name: Resolve deploy target
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENVIRONMENT="${{ inputs.environment }}"
          elif [[ "${GITHUB_REF_NAME}" == "prod-c" ]]; then
            ENVIRONMENT="prod"
          elif [[ "${GITHUB_REF_NAME}" == "dev-c" ]]; then
            ENVIRONMENT="dev"
          else
            echo "Unsupported deploy branch: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          [[ "$ENVIRONMENT" == "prod" ]] && echo "namespace=phasicon" >> "$GITHUB_OUTPUT" || echo "namespace=phasicon-dev" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          # Immutable, sortable and readable: env-YYYYMMDD-HHMM-<short sha>.
          # Resolved once here so both architectures and the deploy agree on it.
          echo "tag=${ENVIRONMENT}-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: [test, prepare]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: [self-hosted, linux, X64]
          - arch: arm64
            platform: linux/arm64
            runner: [self-hosted, linux, ARM64]
    # Native builders, one per architecture. Emulating arm64 under QEMU made
    # this job take hours; these machines also keep their build cache between
    # runs, which a GitHub-hosted runner throws away every time.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform }}
          # No tag here: each architecture is pushed as a bare digest and the
          # merge job below is what names the result. Tagging per architecture
          # would leave the two halves fighting over the same tag.
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # No cache-from/to on purpose. type=gha would ship the whole C++
          # layer cache over the network on every run, which costs more than
          # it saves on a machine that already holds the layers locally.
      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    needs: [prepare, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag }} \
            -t ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.environment }}-latest \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)
      - name: Show what was published
        run: docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag }}

  deploy:
    name: Deploy to Kubernetes
    needs: [prepare, merge]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to Kubernetes
        env:
          SSH_HOST: ${{ secrets.KUBE_SSH_HOST }}
          SSH_USER: ${{ secrets.KUBE_SSH_USER }}
          SSH_KEY: ${{ secrets.KUBE_SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.KUBE_SSH_PORT }}
          NAMESPACE: ${{ needs.prepare.outputs.namespace }}
          IMAGE: ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/kube_deploy_key
          chmod 600 ~/.ssh/kube_deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/kube_deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "kubectl -n '$NAMESPACE' set image deployment/${DEPLOYMENT_NAME} ${CONTAINER_NAME}='$IMAGE' && kubectl -n '$NAMESPACE' rollout status deployment/${DEPLOYMENT_NAME} --timeout=300s"
