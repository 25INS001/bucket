name: bucket CI/CD

on:
  pull_request:
    branches: [prod-c, dev-c]
  push:
    branches: [prod-c, dev-c]
  workflow_dispatch:
    inputs:
      environment:
        description: "Kubernetes environment to deploy"
        required: true
        default: dev
        type: choice
        options: [dev, prod]

env:
  IMAGE_NAME: ghcr.io/25ins001/phasicon-bucket
  DEPLOYMENT_NAME: bucket
  CONTAINER_NAME: bucket

jobs:
  test:
    name: Django tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Django checks and tests
        env:
          DJANGO_SECRET_KEY: ci-secret
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          GARAGE_ENDPOINT: http://127.0.0.1:8333
          GARAGE_ACCESS_KEY: test
          GARAGE_SECRET_KEY: test
          GARAGE_REGION: us-east-1
        run: |
          python manage.py check
          python manage.py test --verbosity 2

  build_push_deploy:
    name: Build, push image, and deploy
    runs-on: ubuntu-24.04
    needs: test
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve deploy target
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENVIRONMENT="${{ inputs.environment }}"
          elif [[ "${GITHUB_REF_NAME}" == "prod-c" ]]; then
            ENVIRONMENT="prod"
          elif [[ "${GITHUB_REF_NAME}" == "dev-c" ]]; then
            ENVIRONMENT="dev"
          else
            echo "Unsupported deploy branch: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          [[ "$ENVIRONMENT" == "prod" ]] && echo "namespace=phasicon" >> "$GITHUB_OUTPUT" || echo "namespace=phasicon-dev" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.target.outputs.tag }}
            ${{ env.IMAGE_NAME }}:${{ steps.target.outputs.environment }}-latest
      - name: Deploy to Kubernetes
        env:
          SSH_HOST: ${{ secrets.KUBE_SSH_HOST }}
          SSH_USER: ${{ secrets.KUBE_SSH_USER }}
          SSH_KEY: ${{ secrets.KUBE_SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.KUBE_SSH_PORT }}
          NAMESPACE: ${{ steps.target.outputs.namespace }}
          IMAGE: ${{ env.IMAGE_NAME }}:${{ steps.target.outputs.tag }}
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/kube_deploy_key
          chmod 600 ~/.ssh/kube_deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/kube_deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "kubectl -n '$NAMESPACE' set image deployment/${DEPLOYMENT_NAME} ${CONTAINER_NAME}='$IMAGE' && kubectl -n '$NAMESPACE' rollout status deployment/${DEPLOYMENT_NAME} --timeout=300s"
