name: bucket CI/CD

on:
  pull_request:
    branches: [prod-c, dev-c]
  push:
    branches: [prod-c, dev-c]
  workflow_dispatch:
    inputs:
      environment:
        description: "Kubernetes environment to deploy"
        required: true
        default: dev
        type: choice
        options: [dev, prod]

# One run per branch at a time. A slow run that finishes after a newer one
# would otherwise deploy its older image on top: auth-service's two-hour
# QEMU-era run landed after a later build and reverted dev to a stale tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/25ins001/phasicon-bucket
  DEPLOYMENT_NAME: bucket
  CONTAINER_NAME: bucket

# Every job runs on self-hosted runners, including the light ones.
#
# GitHub-hosted minutes ran out partway through a production rollout: the two
# Python services merged and recorded fine, the two C++ ones failed with
# "The job was not started because recent account payments have failed or your
# spending limit needs to be increased" -- a job with zero steps, no runner and
# no log, which looks like an infrastructure fault rather than a billing one.
#
# The builds were unaffected because they were already self-hosted, so both
# architectures were sitting in the registry with nothing left to combine them.
# Keeping merge, test and the write-back on hosted runners meant a deploy could
# stall on quota with the images already built.
#
# The cost is serialisation: one X64 runner per repository, so test, prepare,
# the amd64 build, merge and the write-back queue behind each other. arm64 still
# builds in parallel on node2. Slower, and free, and it cannot run out.

jobs:
  test:
    name: Unit tests
    runs-on: [self-hosted, X64]
    # No Postgres service and no Python toolchain: the service is C++/Drogon and
    # the unit suite is deliberately hermetic. S3Presigner has no database, no
    # Drogon app instance and no network, because signing is the part that has
    # to be provably correct and a wrong signature produces a well-formed URL
    # that only fails when a client redeems it.
    steps:
      - uses: actions/checkout@v4
      # Built through the image's own dev stage rather than a toolchain
      # installed on the runner. Same compiler, same Conan dependency set, same
      # CMake invocation the shipped artifact is built from — so a pass here is
      # a statement about the code that ships, not about a lookalike build.
      - name: Build the dev stage
        run: docker build -f docker/Dockerfile --target dev -t bucket-dev .
      # PHASICON_BUILD_TESTS defaults ON, so the dev stage has already compiled
      # bucket-service-tests next to the service binary.
      - name: Run unit tests
        run: docker run --rm bucket-dev ctest --test-dir build --output-on-failure

  prepare:
    name: Resolve deploy target
    runs-on: [self-hosted, X64]
    if: github.event_name != 'pull_request'
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      namespace: ${{ steps.target.outputs.namespace }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - name: Resolve deploy target
        id: target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENVIRONMENT="${{ inputs.environment }}"
          elif [[ "${GITHUB_REF_NAME}" == "prod-c" ]]; then
            ENVIRONMENT="prod"
          elif [[ "${GITHUB_REF_NAME}" == "dev-c" ]]; then
            ENVIRONMENT="dev"
          else
            echo "Unsupported deploy branch: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          [[ "$ENVIRONMENT" == "prod" ]] && echo "namespace=phasicon" >> "$GITHUB_OUTPUT" || echo "namespace=phasicon-dev" >> "$GITHUB_OUTPUT"
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          # Immutable, sortable and readable: env-YYYYMMDD-HHMM-<short sha>.
          # Resolved once here so both architectures and the deploy agree on it.
          echo "tag=${ENVIRONMENT}-$(date -u +%Y%m%d-%H%M)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: [test, prepare]
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            label: X64
          - arch: arm64
            platform: linux/arm64
            label: ARM64
    # Native builders, one per architecture. Emulating arm64 under QEMU made
    # this job take hours; these machines also keep their build cache between
    # runs, which a GitHub-hosted runner throws away every time.
    runs-on: [self-hosted, "${{ matrix.label }}"]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # The C++ build. The Django Dockerfile that used to sit at the repo
          # root is gone; while both existed this line silently kept shipping
          # the Python service with a fully green pipeline.
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          # No tag here: each architecture is pushed as a bare digest and the
          # merge job below is what names the result. Tagging per architecture
          # would leave the two halves fighting over the same tag.
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # No cache-from/to on purpose. type=gha would ship the whole C++
          # layer cache over the network on every run, which costs more than
          # it saves on a machine that already holds the layers locally.
      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Wiped first, and under runner.temp rather than /tmp: on a
          # self-hosted runner the filesystem persists between jobs, so a
          # digest left by an earlier run was being uploaded alongside this
          # one and the merge then referenced an image that no longer exists.
          rm -rf "${{ runner.temp }}/digests"
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    needs: [prepare, build]
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, X64]
    permissions:
      contents: read
      packages: write
    steps:
      # The build job already wipes its own digest directory because a
      # self-hosted runner's filesystem persists between jobs. The merge job
      # needed the same and did not have it: it downloaded into /tmp/digests,
      # which nothing cleared, so `printf ...@sha256:%s *` globbed every digest
      # left by every previous run and imagetools failed with "not found" on an
      # image that had long since been replaced. 18 stale files had built up.
      - name: Clear stale digests
        run: |
          rm -rf "${{ runner.temp }}/digests"
          mkdir -p "${{ runner.temp }}/digests"
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag }} \
            -t ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.environment }}-latest \
            $(printf '${{ env.IMAGE_NAME }}@sha256:%s ' *)
      - name: Show what was published
        run: docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:${{ needs.prepare.outputs.tag }}

  deploy:
    name: Record deployment in git
    needs: [prepare, merge]
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, X64]
    # Five repositories push to one branch. Without a shared lock they race and
    # most attempts land on a rebase; serialising per environment is cheaper
    # than retrying, and keeps the history readable.
    concurrency:
      group: manifests-write-back-${{ needs.prepare.outputs.environment }}
      cancel-in-progress: false
    steps:
      # No kubectl, no SSH key, no kubeconfig. This job cannot reach the
      # cluster at all — it writes a tag to git and Argo CD does the rest. The
      # blast radius of a compromised workflow drops from "cluster admin" to
      # "can open a commit on a branch".
      - name: Check out the manifest repository
        uses: actions/checkout@v4
        with:
          repository: 25INS001/phasicon_backend_services
          ref: dev-c
          token: ${{ secrets.MANIFESTS_TOKEN }}
          path: manifests
          # The manifest repo has six private submodules and none of them are
          # needed to edit a kustomization.
          submodules: false

      - name: Point the environment at the new image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
        run: |
          cd "manifests/k8s/live/${ENVIRONMENT}"
          # Edited line by line rather than through a YAML round-trip: this
          # file carries the comments explaining why it exists, and safe_dump
          # would silently discard every one of them.
          python3 - <<'PY'
          import os, sys

          image = os.environ["IMAGE"]
          tag = os.environ["TAG"]
          path = "kustomization.yaml"

          lines = open(path).read().splitlines(keepends=True)
          out, i, done = [], 0, False
          while i < len(lines):
              out.append(lines[i])
              if lines[i].strip() == f"- name: {image}" and i + 1 < len(lines) \
                 and lines[i + 1].strip().startswith("newTag:"):
                  nxt = lines[i + 1]
                  indent = nxt[: len(nxt) - len(nxt.lstrip())]
                  if nxt.strip() == f"newTag: {tag}":
                      print(f"already at {tag}, nothing to do")
                      sys.exit(0)
                  out.append(f"{indent}newTag: {tag}\n")
                  i += 2
                  done = True
                  continue
              i += 1

          if not done:
              # Failing loudly beats appending a second entry for the same
              # image, which kustomize accepts and resolves unpredictably.
              print(f"::error::no image entry named {image} in {path}")
              sys.exit(1)

          open(path, "w").writelines(out)
          print(f"{image} -> {tag}")
          PY

      - name: Commit and push
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
          SERVICE: ${{ env.DEPLOYMENT_NAME }}
        run: |
          cd manifests
          git config user.name  "phasicon-ci"
          git config user.email "ci@navrobotec.in"

          if git diff --quiet; then
            echo "kustomization already at ${TAG}; nothing to commit"
            exit 0
          fi

          git add "k8s/live/${ENVIRONMENT}/kustomization.yaml"
          git commit -m "deploy(${SERVICE}): ${ENVIRONMENT} -> ${TAG}" \
                     -m "Built from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"

          # Another service may have pushed between checkout and now. Rebase
          # and retry rather than fail: the two commits touch different lines
          # of the same file and never truly conflict.
          for attempt in 1 2 3 4 5; do
            if git push origin dev-c; then
              echo "pushed on attempt ${attempt}"
              exit 0
            fi
            echo "push rejected, rebasing (attempt ${attempt})"
            git pull --rebase origin dev-c || {
              echo "::error::rebase failed — resolve by hand"
              exit 1
            }
            sleep $(( (RANDOM % 8) + 2 ))
          done

          echo "::error::could not push after 5 attempts"
          exit 1
