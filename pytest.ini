[pytest]
# tests/unit  hermetic C++ (built by CMake, run via ctest or the test binary).
#             The SigV4 presigner lives there: it is the part that can be wrong
#             silently, so it is checked with nothing running.
# tests/live  black-box HTTP against a running bucket-service. Skipped unless
#             --live is passed.
#
# The Django contract layer is gone with the Django service. It drove Django's
# test client against SQLite with a fake boto3 — none of which exists after the
# C++ port. The behaviour it described moved to tests/live, where it is
# asserted over the wire; what is lost is that it ran without a stack.
#
#   pip install -r tests/requirements.txt
#   pytest                # collects the live layer and skips it
#   pytest --live         # runs it, needs the stack up and a token
#
#   BUCKET_BASE_URL=http://localhost:8000 BUCKET_TEST_TOKEN=<token> pytest --live
testpaths = tests
python_files = test_*.py
python_functions = test_*

markers =
    live: requires a running bucket-service (enable with --live)
    fuzz: malformed, hostile or oversized input
    defect: encodes a known-broken behaviour

filterwarnings =
    ignore::DeprecationWarning
