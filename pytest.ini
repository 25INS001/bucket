[pytest]
# tests/contract  hermetic. Django test client against SQLite in memory, with
#                 the Garage/S3 client replaced by a fake. No network.
# tests/live      black-box HTTP against a running bucket service, skipped
#                 unless --live is passed.
#
#   pip install -r tests/requirements.txt
#   pytest                # hermetic only — the CI default
#   pytest --live         # adds the live layer
DJANGO_SETTINGS_MODULE = tests.settings
testpaths = tests
python_files = test_*.py
python_functions = test_*

markers =
    contract: hermetic; Django test client, no network
    live: requires a running bucket service (enable with --live)
    fuzz: malformed, hostile or oversized input
    defect: encodes a known-broken behaviour

filterwarnings =
    ignore::DeprecationWarning
